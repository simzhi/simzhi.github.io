<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Zhihao Yang</title>
  <meta name="description" content="Zhihao Yang – engineer working where customer needs meet software and technical systems. Based near Munich.">

  <!-- Logo：浏览器标签页图标、手机主屏幕图标 -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <meta name="theme-color" content="#050608" media="(prefers-color-scheme: dark)">

  <!--
    如何修改本页面
    ------------------------------------------------------------
    • 所有文字（英 / 德 / 中三种语言）都在 content.js 里，改文字只需改那个文件。
    • 照片：替换同一文件夹里的 photo.jpg 即可（文件名保持不变）。
    • 颜色：改下面 :root 里的 --accent 一个值，全站强调色随之改变。
    • 邮箱 / LinkedIn 链接在本文件 “CONTACT” 部分（搜索 zhihao.yang@gmx.de）。
    • 页面底部的 <script> 只负责动画和交互，一般不需要动。
  -->

  <style>
    /* =========================================================
       配色与“液态玻璃”材质 —— 想换强调色，只改 --accent
       ========================================================= */
    :root {
      --bg: #f2f4f8;
      --text: #1d1d1f;
      --muted: #5e5e66;
      --line: rgba(0,0,0,.08);
      --accent: #0071e3;          /* ← 强调色 */
      --accent-2: #5e5ce6;
      --radius: 26px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Roboto, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --ease: cubic-bezier(.25,.1,.25,1);
      --spring: cubic-bezier(.34,1.56,.64,1);

      /* 背景里流动的彩色光斑 */
      --blob-1: #8ab4ff; --blob-2: #c8b0ff; --blob-3: #93e6d8; --blob-4: #ffd2b3; --blob-o: .75;

      /* 液态玻璃材质 */
      --g-tint:  rgba(255,255,255,.40);
      --g-sheen: linear-gradient(135deg, rgba(255,255,255,.60) 0%, rgba(255,255,255,.14) 38%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.28) 100%);
      --g-spot:  rgba(255,255,255,.60);
      --g-blur:  blur(22px) saturate(185%);
      --g-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 0 0 1px rgba(255,255,255,.50),
        inset 0 -1px 1px rgba(255,255,255,.35),
        0 1px 2px rgba(20,30,80,.05),
        0 14px 40px rgba(20,30,80,.10);
      --lens: rgba(255,255,255,.70);
      --lens-shadow: inset 0 1px 1px rgba(255,255,255,1), inset 0 -1px 2px rgba(0,0,0,.08), 0 3px 10px rgba(0,0,0,.12);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #050608;
      --text: #f5f5f7;
      --muted: #a8a8b0;
      --line: rgba(255,255,255,.10);
      --accent: #2997ff;
      --accent-2: #8e8cff;
      --blob-1: #1e4fd6; --blob-2: #6a2bd9; --blob-3: #0d7a70; --blob-4: #9c3b14; --blob-o: .55;
      --g-tint:  rgba(36,36,44,.42);
      --g-sheen: linear-gradient(135deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.04) 38%, rgba(255,255,255,0) 62%, rgba(255,255,255,.07) 100%);
      --g-spot:  rgba(255,255,255,.12);
      --g-shadow:
        inset 0 1px 0 rgba(255,255,255,.24),
        inset 0 0 0 1px rgba(255,255,255,.09),
        inset 0 -1px 1px rgba(0,0,0,.35),
        0 14px 40px rgba(0,0,0,.50);
      --lens: rgba(255,255,255,.17);
      --lens-shadow: inset 0 1px 1px rgba(255,255,255,.45), inset 0 -1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.35);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color .6s var(--ease), color .6s var(--ease);
    }
    html[lang^="zh"] body { letter-spacing: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 背景：缓慢流动的光斑（玻璃需要有东西可以“透”） ---------- */
    .ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .ambient i { position: absolute; border-radius: 50%; opacity: var(--blob-o); transition: opacity .6s; will-change: transform; }
    .ambient .b1 { width: 70vmax; height: 70vmax; left: -22vmax; top: -24vmax; background: radial-gradient(circle, var(--blob-1) 0%, transparent 68%); animation: drift1 26s ease-in-out infinite alternate; }
    .ambient .b2 { width: 60vmax; height: 60vmax; right: -20vmax; top: 4vmax; background: radial-gradient(circle, var(--blob-2) 0%, transparent 68%); animation: drift2 32s ease-in-out infinite alternate; }
    .ambient .b3 { width: 58vmax; height: 58vmax; left: 6vmax; bottom: -30vmax; background: radial-gradient(circle, var(--blob-3) 0%, transparent 68%); animation: drift3 29s ease-in-out infinite alternate; }
    .ambient .b4 { width: 46vmax; height: 46vmax; right: -6vmax; bottom: -16vmax; background: radial-gradient(circle, var(--blob-4) 0%, transparent 68%); animation: drift1 36s ease-in-out infinite alternate-reverse; }
    @keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.12); } }
    @keyframes drift2 { to { transform: translate(-12vmax, 14vmax) scale(.9); } }
    @keyframes drift3 { to { transform: translate(10vmax, -12vmax) scale(1.08); } }

    /* =========================================================
       通用液态玻璃材质：所有卡片、按钮、导航都用它
       ========================================================= */
    .glass, nav.bar, .badge, .portrait, .btn.ghost, .seg, .stat, .tile, .item, .chip, .ccard, .toast, .theme-btn {
      background:
        radial-gradient(280px circle at var(--mx, -999px) var(--my, -999px), var(--g-spot), transparent 60%),
        var(--g-sheen),
        var(--g-tint);
      -webkit-backdrop-filter: var(--g-blur);
      backdrop-filter: var(--g-blur);
      box-shadow: var(--g-shadow);
    }
    /* 在支持的浏览器（Chrome / Edge）里给导航和语言切换加入真实折射 */
    .refract {
      -webkit-backdrop-filter: url(#lg-refract) blur(4px) saturate(190%) brightness(1.05) !important;
      backdrop-filter: url(#lg-refract) blur(4px) saturate(190%) brightness(1.05) !important;
    }

    /* language crossfade */
    #main, .links a { transition: opacity .22s var(--ease), filter .22s var(--ease), color .2s, background .2s, box-shadow .2s; }
    body.switching #main, body.switching .links a { opacity: 0; filter: blur(6px); }

    /* ---------- Progress bar ---------- */
    #progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 60;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
    }

    /* ---------- 悬浮玻璃导航 ---------- */
    nav.bar {
      position: fixed; top: 14px; left: 50%; z-index: 50;
      transform: translateX(-50%);
      width: min(980px, calc(100% - 28px));
      border-radius: 999px;
      transition: width .6s var(--spring), top .4s var(--ease);
    }
    nav.bar.compact { width: min(720px, calc(100% - 28px)); top: 10px; }
    nav.bar .inner { display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 7px 0 12px; }
    .brand { font-weight: 600; color: var(--text); font-size: 15px; letter-spacing: 0; white-space: nowrap; display: inline-flex; align-items: center; gap: 10px; }
    .brand-logo { width: 30px; height: 30px; display: block; border-radius: 50%;
      box-shadow: 0 2px 8px rgba(40,60,200,.25); transition: transform .6s var(--spring); }
    .brand:hover .brand-logo { transform: rotate(-12deg) scale(1.08); }
    .brand:hover { text-decoration: none; }
    .links { display: flex; gap: 2px; align-items: center; }
    .links a { color: var(--muted); font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
    .links a:hover { color: var(--text); text-decoration: none; }
    .links a.active { color: var(--text); background: var(--lens); box-shadow: var(--lens-shadow); }
    .theme-btn {
      margin-left: 6px; width: 40px; height: 40px; border-radius: 50%; border: 0;
      color: var(--text); cursor: pointer; display: grid; place-items: center;
      transition: transform .5s var(--spring);
    }
    .theme-btn:hover { transform: scale(1.08); }
    .theme-btn:active { transform: scale(.9) rotate(40deg); }
    .theme-btn svg { width: 17px; height: 17px; }

    /* ---------- Hero ---------- */
    .hero { position: relative; min-height: 100vh; display: flex; align-items: center; padding: 120px 0 110px; }
    .glow {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(34% 30% at var(--gx, 70%) var(--gy, 40%), color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    }
    .hero .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: 1.25fr 1fr; gap: 56px; align-items: center; }
    .eyebrow { color: var(--accent); font-weight: 600; font-size: 17px; margin: 0 0 12px; }
    .hero h1 { font-size: clamp(48px, 8vw, 88px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 700; margin: 0 0 20px; }
    .hero h1 .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .rotator { font-size: clamp(21px, 2.6vw, 28px); font-weight: 600; line-height: 1.25; margin: 0 0 16px; min-height: 2.5em; }
    .rotator .word { color: var(--muted); display: inline-block; transition: opacity .35s var(--ease), transform .35s var(--ease), filter .35s; }
    .rotator .word.out { opacity: 0; transform: translateY(8px); filter: blur(4px); }
    .hero .lead { color: var(--muted); font-size: 19px; max-width: 34ch; margin: 0 0 32px; }
    html[lang^="zh"] .hero .lead { max-width: 22em; }
    .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 24px; border-radius: 999px; font-size: 17px; font-weight: 500;
      border: 0; cursor: pointer; font-family: inherit;
      transition: transform .4s var(--spring), box-shadow .3s;
    }
    .btn:hover { text-decoration: none; transform: scale(1.04); }
    .btn:active { transform: scale(.96); }
    .btn.primary {   /* 带颜色的玻璃 */
      color: #fff;
      background:
        linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0) 55%),
        linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px rgba(255,255,255,.18), inset 0 -2px 4px rgba(0,0,0,.12),
                  0 10px 28px color-mix(in srgb, var(--accent) 38%, transparent);
    }
    .btn.ghost { color: var(--accent); }

    .portrait-wrap { perspective: 1000px; justify-self: center; position: relative; }
    .portrait {   /* 玻璃相框 */
      width: min(370px, 80vw); aspect-ratio: 4/5; border-radius: 42px; padding: 10px;
      transform-style: preserve-3d; transition: transform .3s var(--ease); position: relative;
    }
    .portrait .photo { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; position: relative; }
    .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 52% 28%; display: block; transform: scale(1.04); }
    .portrait .photo::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(60% 50% at var(--px, 50%) var(--py, 0%), rgba(255,255,255,.30), transparent 60%);
      mix-blend-mode: soft-light;
    }
    .badge {
      position: absolute; left: -22px; bottom: 34px; border-radius: 999px; padding: 10px 16px;
      font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #30d158; box-shadow: 0 0 0 4px rgba(48,209,88,.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(48,209,88,0); } }

    /* ---------- Sections ---------- */
    section.block { padding: 110px 0; }
    .kicker { color: var(--accent); font-weight: 600; font-size: 17px; margin: 0 0 8px; }
    h2 { font-size: clamp(36px, 5vw, 56px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; margin: 0 0 28px; max-width: 18ch; }
    html[lang^="zh"] h2 { letter-spacing: 0; max-width: 12em; }
    .prose p { font-size: 21px; line-height: 1.5; color: var(--muted); max-width: 40ch; margin: 0 0 20px; }
    html[lang^="zh"] .prose p { max-width: 24em; line-height: 1.7; }
    .prose p strong { color: var(--text); font-weight: 600; }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }

    /* stats */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .stat { border-radius: var(--radius); padding: 28px; transition: transform .5s var(--spring), opacity .9s var(--ease); }
    .stat:hover { transform: translateY(-4px) scale(1.02); }
    .stat .n { font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stat .l { color: var(--muted); font-size: 15px; margin-top: 8px; }

    /* bento values */
    .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-top: 8px; }
    .tile {
      position: relative; overflow: hidden; border-radius: var(--radius); padding: 32px; min-height: 240px;
      display: flex; flex-direction: column; justify-content: flex-end;
      transition: transform .5s var(--spring), opacity .9s var(--ease);
    }
    .tile:hover { transform: translateY(-5px) scale(1.01); }
    .tile.w4 { grid-column: span 4; } .tile.w2 { grid-column: span 2; } .tile.w3 { grid-column: span 3; } .tile.w6 { grid-column: span 6; }
    .tile .icon {
      width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center;
      font-size: 30px; line-height: 1; margin-bottom: auto;
      background: var(--lens); box-shadow: var(--lens-shadow);
    }
    .tile .icon + h3 { margin-top: 36px; }
    .tile h3 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
    .tile p { color: var(--muted); margin: 0; font-size: 17px; max-width: 38ch; }
    .tile.feature {   /* 带颜色的玻璃卡片 */
      color: #fff;
      background:
        radial-gradient(280px circle at var(--mx, -999px) var(--my, -999px), rgba(255,255,255,.28), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 50%),
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 82%, transparent), color-mix(in srgb, var(--accent-2) 78%, transparent));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(255,255,255,.22),
                  0 18px 48px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .tile.feature p { color: rgba(255,255,255,.88); }
    .tile.feature .icon { background: rgba(255,255,255,.22); box-shadow: inset 0 1px 1px rgba(255,255,255,.7), inset 0 0 0 1px rgba(255,255,255,.2); }

    /* segmented control（玻璃轨道 + 弹性镜片） */
    .seg { display: inline-flex; position: relative; padding: 5px; border-radius: 999px; margin-bottom: 28px; }
    .seg button {
      position: relative; z-index: 1; border: 0; background: transparent; color: var(--text);
      font: inherit; font-size: 14px; font-weight: 500; padding: 8px 20px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    }
    .seg .pill {
      position: absolute; top: 5px; bottom: 5px; left: 5px; border-radius: 999px;
      background: var(--lens); box-shadow: var(--lens-shadow);
      transition: transform .6s var(--spring), width .6s var(--spring);
    }

    /* timeline */
    .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .item { border-radius: 22px; overflow: hidden; transition: opacity .9s var(--ease), transform .9s var(--ease); }
    .item.hidden { display: none; }
    .item button.head {
      all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
      display: grid; grid-template-columns: 120px 1fr 30px; gap: 16px; align-items: center; padding: 22px 24px;
    }
    .item button.head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 22px; }
    .when { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
    .title strong { display: block; font-size: 19px; font-weight: 600; letter-spacing: -0.015em; }
    .title span { color: var(--muted); font-size: 15px; }
    .chev {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: var(--lens); box-shadow: var(--lens-shadow);
      transition: transform .5s var(--spring), background .25s;
    }
    .chev svg { width: 12px; height: 12px; }
    .item.open .chev { transform: rotate(45deg); background: var(--accent); color: #fff; }
    .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
    .item.open .body { grid-template-rows: 1fr; }
    .body > div { overflow: hidden; }
    .body ul { margin: 0; padding: 0 24px 24px calc(24px + 120px + 16px); color: var(--muted); }
    .body li { margin: 0 0 6px; }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 44px; }
    .chip { padding: 9px 17px; border-radius: 999px; font-size: 15px; transition: transform .4s var(--spring); }
    .chip:hover { transform: translateY(-3px) scale(1.06); }

    /* contact */
    .contact { text-align: center; }
    .contact h2 { margin-left: auto; margin-right: auto; }
    .contact .prose p { margin-left: auto; margin-right: auto; }
    .contact-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 48px; text-align: left; }
    .ccard {
      border-radius: var(--radius); padding: 28px; border: 0; font: inherit; cursor: pointer; text-align: left;
      display: flex; flex-direction: column; gap: 6px; color: var(--text);
      transition: transform .5s var(--spring), opacity .9s var(--ease);
    }
    .ccard:hover { transform: translateY(-5px) scale(1.02); text-decoration: none; }
    .ccard .ic {
      width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; margin-bottom: 14px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 4px rgba(0,0,0,.15), 0 6px 16px rgba(0,0,0,.15);
    }
    .ccard .ic svg { width: 23px; height: 23px; }
    .ccard .k { font-size: 13px; color: var(--muted); }
    .ccard .v { font-size: 17px; font-weight: 600; word-break: break-word; }
    .ccard .h { font-size: 13px; color: var(--accent); margin-top: 6px; }

    footer { padding: 24px 0 120px; color: var(--muted); font-size: 12px; text-align: center; }

    /* toast */
    .toast {
      position: fixed; left: 50%; bottom: 96px; z-index: 70;
      transform: translate(-50%, 20px) scale(.9); opacity: 0; pointer-events: none;
      padding: 12px 22px; border-radius: 999px; font-size: 15px; font-weight: 500;
      transition: opacity .3s var(--ease), transform .5s var(--spring);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    /* =====================================================
       LIQUID GLASS 语言切换
       ===================================================== */
    .lang-dock {
      position: fixed; left: 50%; bottom: 24px; z-index: 65;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 2px;
      padding: 5px; border-radius: 999px; isolation: isolate;
      background: var(--g-sheen), var(--g-tint);
      -webkit-backdrop-filter: blur(8px) saturate(190%) brightness(1.06);
      backdrop-filter: blur(8px) saturate(190%) brightness(1.06);
      box-shadow: var(--g-shadow), 0 12px 32px rgba(0,0,0,.12);
      touch-action: none; user-select: none; -webkit-user-select: none;
      transition: transform .4s var(--spring);
      animation: dockIn .9s var(--spring) .6s backwards;
    }
    @keyframes dockIn { from { opacity: 0; transform: translate(-50%, 40px) scale(.8); } }
    .lang-dock:active { transform: translateX(-50%) scale(1.03); }
    .lang-dock::after {
      content: ""; position: absolute; left: 10%; right: 10%; top: 2px; height: 45%;
      border-radius: 999px; pointer-events: none; z-index: 0;

  <script>

    function current() { return dock.querySelector('[data-lang="' + lang + '"]'); }
    function placeLens(btn, stretch) {
      var x = btn.offsetLeft, w = btn.offsetWidth;
      lens.style.width = w + 'px';
      clearTimeout(lensTimer);
      if (stretch && !reduce) {
        // 液体般的拉伸，再弹回
        lens.style.transform = 'translateX(' + x + 'px) scale(1.22, .82)';
        lensTimer = setTimeout(function () { lens.style.transform = 'translateX(' + x + 'px) scale(1)'; }, 170);
      } else {
        lens.style.transform = 'translateX(' + x + 'px) scale(1)';
      }
    }
    function setLang(l, animate) {
      if (l === lang) { placeLens(current(), animate); return; }
      lang = l;
      try { localStorage.setItem('lang', l); } catch (e) {}
      root.setAttribute('lang', l === 'zh' ? 'zh-Hans' : l);
      lbtns.forEach(function (b) { b.setAttribute('aria-checked', b.dataset.lang === l); b.tabIndex = b.dataset.lang === l ? 0 : -1; });
      placeLens(current(), animate);
      if (reduce) { render(); return; }
      document.body.classList.add('switching');
      setTimeout(function () {
        render();
        $$('#main .reveal').forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.top < innerHeight && r.bottom > 0) el.classList.add('in');
        });
        document.body.classList.remove('switching');
      }, 220);
    }

    var drag = null;
    dock.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      var dr = dock.getBoundingClientRect();
      drag = { left: dr.left, moved: false, x0: e.clientX };
      dock.classList.add('pressed');
      try { dock.setPointerCapture(e.pointerId); } catch (err) {}
      var lr = lens.getBoundingClientRect();
      // 按下时镜片放大
      lens.style.transform = 'translateX(' + (lr.left - dr.left) + 'px) scale(1.12)';
    });
    dock.addEventListener('pointermove', function (e) {
      if (!drag) return;
      if (Math.abs(e.clientX - drag.x0) > 4) { drag.moved = true; dock.classList.add('dragging'); }
      if (!drag.moved) return;
      var w = lens.offsetWidth, first = lbtns[0], last = lbtns[lbtns.length - 1];
      var min = first.offsetLeft, max = last.offsetLeft + last.offsetWidth - w;
      var x = Math.max(min, Math.min(max, e.clientX - drag.left - w / 2));
      lens.style.transform = 'translateX(' + x + 'px) scale(1.12, 1.05)';
    });
    function endDrag(e) {
      if (!drag) return;
      var target = null, best = 1e9;
      lbtns.forEach(function (b) {
        var r = b.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2));
        if (d < best) { best = d; target = b; }
      });
      drag = null;
      dock.classList.remove('pressed', 'dragging');
      setLang(target.dataset.lang, true);
    }
    dock.addEventListener('pointerup', endDrag);
    dock.addEventListener('pointercancel', function () { drag = null; dock.classList.remove('pressed', 'dragging'); placeLens(current(), false); });
    // 键盘：回车 / 空格（click 由键盘触发时 detail 为 0）
    lbtns.forEach(function (b) {
      b.addEventListener('click', function (e) { if (e.detail === 0) setLang(b.dataset.lang, true); });
    });
    dock.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var i = lbtns.indexOf(current()) + (e.key === 'ArrowRight' ? 1 : -1);
      i = (i + lbtns.length) % lbtns.length;
      setLang(lbtns[i].dataset.lang, true); lbtns[i].focus(); e.preventDefault();
    });

    /* ---------- 启动 ---------- */
    lbtns.forEach(function (b) { b.setAttribute('aria-checked', b.dataset.lang === lang); b.tabIndex = b.dataset.lang === lang ? 0 : -1; });
    render();
    placeLens(current(), false);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { initPill(); placeLens(current(), false); });
  })();
  </script>
</body>
</html>
