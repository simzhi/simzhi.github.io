      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset=".55" stop-color="#3D63F0"/>
      <stop offset="1" stop-color="#4B3FC9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="50" y1="3" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
